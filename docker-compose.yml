name: job-tracker

services:
  mysql:
    image: mysql:8.0
    container_name: job-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: jt_password
      MYSQL_DATABASE: job_tracker
      MYSQL_USER: jt_user
      MYSQL_PASSWORD: jt_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pjt_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "6310:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: job_tracker_backend
    container_name: job_tracker_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: jt_user
      SPRING_DATASOURCE_PASSWORD: jt_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
    ports:
      - "8080:8080"

  frontend:
    build:
      context: job_tracker_frontend
    container_name: job_tracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_JOB_TRACKER_BACKEND: http://localhost:8080/api/v1/
    ports:
      - "7777:80"

volumes:
  mysql-data: